</g>
<path d="M210 160H230M210 210H230M280 160H300M280 210H300M350 160H370M350 210H370M530 170H550M530 220H550" stroke="#993C1D" stroke-width="1.5"/>
<g class="ray">
<line x1="233" y1="150" x2="245" y2="141" marker-end="url(#ray)"/><line x1="233" y1="200" x2="245" y2="191" marker-end="url(#ray)"/>
<line x1="303" y1="150" x2="315" y2="141" marker-end="url(#ray)"/><line x1="303" y1="200" x2="315" y2="191" marker-end="url(#ray)"/>
<line x1="373" y1="150" x2="385" y2="141" marker-end="url(#ray)"/><line x1="373" y1="200" x2="385" y2="191" marker-end="url(#ray)"/>
<line x1="553" y1="160" x2="565" y2="151" marker-end="url(#ray)"/><line x1="553" y1="210" x2="565" y2="201" marker-end="url(#ray)"/>
</g>

<!-- Power capacitors -->
<text x="180" y="58">+5V</text>
<text x="604" y="166" text-anchor="end">+</text>
<text class="b" x="612" y="238" text-anchor="middle">C1</text><text x="612" y="254" text-anchor="middle">470µF</text>
<text class="b" x="655" y="238" text-anchor="middle">C2</text><text x="655" y="254" text-anchor="middle">100nF</text>

<!-- Radio power -->
<text x="186" y="435" text-anchor="end">+5V</text>
<rect x="230" y="410" width="100" height="50" rx="6" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.6"/>
