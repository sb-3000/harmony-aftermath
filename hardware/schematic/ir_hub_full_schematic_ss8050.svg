<g class="w">
<circle cx="282" cy="290" r="20"/><path d="M252 290H274M274 278V302M274 284L290 272V260"/>
<line x1="274" y1="296" x2="289" y2="307" marker-end="url(#arrow)"/><path d="M290 308V320"/>
<circle cx="532" cy="290" r="20"/><path d="M502 290H524M524 278V302M524 284L540 272V260"/>
<line x1="524" y1="296" x2="539" y2="307" marker-end="url(#arrow)"/><path d="M540 308V320"/>
</g>
<text x="296" y="252">C</text><text x="258" y="278">B</text><text x="279" y="324" text-anchor="end">E</text>
<text class="b" x="310" y="282">Q1</text><text x="310" y="300">SS8050</text>
<text x="546" y="252">C</text><text x="508" y="278">B</text><text x="529" y="324" text-anchor="end">E</text>
<text class="b" x="560" y="282">Q2</text><text x="560" y="300">SS8050</text>

<!-- Resistors -->
<rect class="res" x="196" y="90" width="48" height="24" rx="4"/><text x="220" y="102" text-anchor="middle">22 Ω</text>
<rect class="res" x="266" y="90" width="48" height="24" rx="4"/><text x="290" y="102" text-anchor="middle">22 Ω</text>
<rect class="res" x="336" y="90" width="48" height="24" rx="4"/><text x="360" y="102" text-anchor="middle">22 Ω</text>
