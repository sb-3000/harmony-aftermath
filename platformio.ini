[platformio]
default_envs = hub

[env:hub]
platform = espressif32@6.10.0
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; esptool's stub loses contact over native USB on this board, so use the ROM loader.
upload_speed = 115200
upload_flags = --no-stub
; Larger firmware slots, to make room for Bluetooth. Changing this needs a USB flash.
board_build.partitions = partitions.csv
lib_deps =
    nrf24/RF24@1.4.11
    bblanchon/ArduinoJson@7.2.1
    h2zero/NimBLE-Arduino@1.4.3
build_flags =
    ; The XIAO ESP32-C3 plugs straight into the C3's USB pins, so Serial has to use USB.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Each Bluetooth host keeps about 5 subscriptions (one per input report, battery, service
    ; changed). NimBLE's default of 8 fills up with two hosts, and then it deletes the oldest
    ; bond, which silently unpairs the PC. Room for several hosts and spare bonds:
    -DCONFIG_BT_NIMBLE_MAX_CCCDS=32
    -DCONFIG_BT_NIMBLE_MAX_BONDS=6
