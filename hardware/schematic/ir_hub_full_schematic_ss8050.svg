<path d="M150 330H160V375H360M400 375H430V290H502"/>
<path d="M475 290V305M475 335V345"/>
<path d="M540 114V123M540 129V150M540 170V200M540 220V243M540 249V260"/>
<path d="M540 320V330"/>
<path d="M612 70V175M612 185V215"/>
<path d="M655 70V175M655 185V215"/>
<path d="M598 175H626M598 185H626" stroke-width="2"/>
<path d="M645 175H665M645 185H665" stroke-width="2"/>
<path d="M190 435H230M330 435H630"/>
<path d="M500 435V480M575 435V500M575 510V540M630 435V500M630 510V540"/>
