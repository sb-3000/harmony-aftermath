<rect class="res" x="218" y="305" width="24" height="30" rx="4"/><text x="212" y="320" text-anchor="end">10k</text>
<rect class="res" x="360" y="363" width="40" height="24" rx="4"/><text x="380" y="375" text-anchor="middle">220 Ω</text>
<rect class="res" x="463" y="305" width="24" height="30" rx="4"/><text x="457" y="320" text-anchor="end">10k</text>

<!-- Blaster jack -->
<rect x="502" y="126" width="76" height="120" rx="6" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="4 3"/>
<text class="b" x="508" y="140">J1</text>

<!-- IR LEDs -->
<g class="led">
<polygon points="210,140 230,140 220,160"/><polygon points="210,190 230,190 220,210"/>
<polygon points="280,140 300,140 290,160"/><polygon points="280,190 300,190 290,210"/>
<polygon points="350,140 370,140 360,160"/><polygon points="350,190 370,190 360,210"/>
