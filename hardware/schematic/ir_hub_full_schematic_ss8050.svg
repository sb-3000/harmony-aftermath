<svg xmlns="http://www.w3.org/2000/svg" width="1360" height="1240" viewBox="0 30 680 620" role="img">
<title>Harmony hub schematic: IR drivers, AMS1117 and nRF24L01</title>
<desc>ESP32-C3 (5V, GND, D10, D7, D1 to D5). D10 drives SS8050 Q1 through 220 ohm with a 10k pulldown, switching three strings of two IR LEDs, each fed from 5V through 22 ohm. D7 drives SS8050 Q2 the same way for the blaster jack J1 with two LEDs and 22 ohm. C1 470 uF and C2 100 nF on 5V. An AMS1117 3.3V module powers an nRF24L01 on D1 to D5, with C3 10 uF and C4 100 nF at the radio.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:12px;fill:#3D3D3A;dominant-baseline:central}
.b{font-size:14px;font-weight:600;fill:#2C2C2A}
.w{fill:none;stroke:#2C2C2A;stroke-width:1}
.res{fill:#F1EFE8;stroke:#888780;stroke-width:0.6}
.led{fill:#F0997B;stroke:#993C1D;stroke-width:1}
.ray{stroke:#D85A30;stroke-width:1;fill:none}
</style>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#2C2C2A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="ray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect x="0" y="30" width="680" height="620" fill="#FFFFFF"/>

<!-- ESP32-C3 -->
<rect x="30" y="40" width="120" height="575" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.6"/>
<text class="b" x="90" y="200" text-anchor="middle" style="fill:#085041">ESP32-C3</text>

<!-- ESP32-C3 pins -->
<text x="140" y="70" text-anchor="end">5V</text>
<text x="140" y="110" text-anchor="end">GND</text>
<text x="140" y="290" text-anchor="end">D10</text>
<text x="140" y="330" text-anchor="end">D7</text>
<text x="140" y="490" text-anchor="end">D1</text>
<text x="140" y="516" text-anchor="end">D2</text>
<text x="140" y="542" text-anchor="end">D3</text>
<text x="140" y="568" text-anchor="end">D4</text>
<text x="140" y="594" text-anchor="end">D5</text>

<!-- Wires -->
<g class="w">
<path d="M150 70H660"/>
