<text class="b" x="500" y="532" text-anchor="middle" style="fill:#0C447C">nRF24</text><text x="500" y="550" text-anchor="middle" style="fill:#185FA5">L01</text>
<text x="532" y="572" text-anchor="end">IRQ nc</text>
<text x="567" y="494" text-anchor="end">+</text>
<text class="b" x="575" y="562" text-anchor="middle">C3</text><text x="575" y="578" text-anchor="middle">10µF</text>
<text class="b" x="630" y="562" text-anchor="middle">C4</text><text x="630" y="578" text-anchor="middle">100nF</text>
</svg>
